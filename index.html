<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<title>Chasse à l’homme</title>

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

.home{height:100%;overflow:auto;padding:20px;max-width:560px;margin:auto}
.home h1{color:var(--hl)}.cdd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.home input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);margin:6px 0}
.home button,.fill{background:var(--hl);color:var(--on);border:0;border-radius:12px;padding:11px 16px;font-weight:700}

.hud>*{pointer-events:auto}
.top{background:var(--hud);border:1px solid var(--bd);border-radius:20px;padding:12px 20px;display:flex;justify-content:space-between}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.it{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);min-height:150px}
.it .ic{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:22px}
.it h4{margin:6px 0 0;font-size:14px;text-transform:uppercase}.it p{margin:0;color:var(--mu);font-size:13px;flex:1}
.it .pr{font:700 16px ui-monospace,monospace}.it.no{opacity:.45}

.pan input[type=text],#ci{flex:1;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--fg);min-width:0}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.prow b{flex:1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--hl)}
.warn{background:#d33;color:#fff;border-color:#d33}.okb{background:var(--hl);color:var(--on)}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:1000;background:#111;color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;display:none;max-width:90%;text-align:center}
</style></head><body><div id="app"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const inc=n=>firebase.firestore.FieldValue.increment(n);
let db,uid,code,G=null,P={},CH=[],unsubs=[],wid,lastSent=0,myPos=null,shown='',ending=false,tm,map,tile,layer,view='',bg=true,ready=false,name='',E={},SH=null,pubIdx=-1,earnAt=0,lastBuy=0,outAt=0,outDone=false,scanC=null,svT,barK='',chatTo='all',wl;

[3,'cdHunt','Recharge zombies','n',0,600,10,'s']];
/* Objets : [id, nom, description, prix, icône] */
const IT={hunter:[
['ping','Ping','Révèle la distance du survivant le plus proche',20,'📡'],
['scan','Scanner','Affiche un cercle de 50 m autour d’un survivant',50,'🎯'],
['ghost','Fantôme','Empêche la diffusion de ton prochain ping',80,'👻'],
['move','Déplaceur de zone','Déplace la zone 80 % plus près de toi',100,'🧲'],

['sense','Sixième sens','Montre la direction du zombie le plus proche',80,'🦻'],
['shield','Bouclier de zone','Protège contre le prochain ping hors zone',100,'🛡'],
['decoy','Leurre','Place un faux ping sur la carte',100,'🪤'],
['camo','Camouflage','Ignore ton prochain ping de position',150,'🫥']]};

async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&code)wake()});

function init(){
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){app.innerHTML='<p class="er">Erreur Firebase : '+esc(e.message)+'</p>';return}
  try{uid=localStorage.getItem('mh_uid')}catch(e){}
  if(!uid){uid=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('mh_uid',uid)}catch(e){}}
  home();
}
function home(err){
  cleanup();document.body.className='';
  app.innerHTML=`<div class="home"><h1>🎯 Chasse à l’homme</h1>
  <div class="cdd"><label>Ton pseudo<input id="nm" maxlength="20" value="${esc(name)}"></label></div>
  <div class="cdd"><h3>Rejoindre une partie</h3><input id="cd" placeholder="Identifiant de partie" maxlength="8" style="text-transform:uppercase"><button id="jn">Rejoindre</button></div>
  <div class="cdd"><h3>Organiser</h3><p class="mu">Tu seras l’admin : tu règles la partie et tu la lances.</p><button id="mk">Créer une partie</button></div>
  <p class="er" id="er">${err||''}</p></div>`;
  const nm=()=>{name=$('#nm').value.trim();if(!name){$('#er').textContent='Choisis un pseudo.';return false}try{localStorage.setItem('mh_name',name)}catch(e){}return true};
  $('#jn').onclick=async()=>{if(!nm())return;const c=$('#cd').value.trim().toUpperCase();if(!c)return;
    try{const s=await db.doc('games/'+c).get();if(!s.exists){$('#er').textContent='Partie introuvable.';return}enter(c)}catch(e){$('#er').textContent='Erreur : '+(e.message||e.code)}};
  $('#mk').onclick=async()=>{if(!nm())return;const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];
    try{await db.doc('games/'+c).set({adminId:uid,status:'lobby',cfg:D,created:Date.now()});enter(c)}catch(e){$('#er').textContent='Création impossible : '+(e.message||e.code)}};
}
function cleanup(){unsubs.forEach(f=>f());unsubs=[];clearInterval(tm);if(wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(wid);wid=null;if(map){map.remove();map=null}if(wl){wl.release().catch(()=>{});wl=null}
  G=null;P={};CH=[];shown='';ending=false;ready=false;pubIdx=-1;earnAt=0;lastBuy=0;outAt=0;outDone=false;scanC=null;barK='';SH=null;code=null}
async function enter(c){
  cleanup();code=c;wake();
  const pr=db.doc(`games/${c}/players/${uid}`),pin=String(1000+Math.floor(Math.random()*9000));
  try{const s=await pr.get();if(!s.exists)await pr.set({name,team:'',caught:false,money:0,pin});else{const u={name};if(!s.data().pin)u.pin=pin;await pr.update(u)}}catch(e){home('Erreur : '+(e.message||e.code));return}
  unsubs.push(db.doc('games/'+c).onSnapshot(s=>{
    if(!s.exists){home('Cette partie n’existe plus.');return}
    G=s.data();const k=G.status+(G.adminId===uid);if(k!==shown){shown=k;build()}update();
  }));
  unsubs.push(db.collection(`games/${c}/players`).onSnapshot(q=>{P={};q.docs.forEach(d=>P[d.id]=d.data());ready=true;update();liveRefresh()}));
  unsubs.push(db.collection(`games/${c}/chat`).orderBy('ts').limitToLast(60).onSnapshot(q=>{CH=q.docs.map(d=>d.data());liveRefresh()},()=>{}));

}
function startGeo(){
  if(!navigator.geolocation)return;

}
function sendPos(){const m=P[uid];if(!myPos||!m||!m.team||Date.now()-lastSent<4000)return;lastSent=Date.now();
  const u={lat:myPos.lat,lng:myPos.lng,ts:Date.now()},c=cfg();
  if(G&&G.status==='running'&&!m.caught&&c.pings!==false&&(m.team==='prey'||c.pingAll==='all')){
    const i=Math.floor((Date.now()-G.startedAt)/(c.pingMin*60000))-(c.first?0:1);
    if(i>=0&&i!==pubIdx){pubIdx=i;
      if(m.ghost){u.pub=null;u.ghost=false}
      else if(m.decoy){u.pub=Object.assign({at:Date.now()},m.decoy);u.decoy=null}

function capture(id){const c=cfg(),u=c.convert!==false?{team:'hunter',caught:false,wasCaught:true,pub:null}:{caught:true};
  db.doc(`games/${code}/players/${id}`).update(u);
  if(c.eco!==false&&c.ccap)db.doc(`games/${code}/players/${uid}`).update({money:inc(c.ccap)});toast('Capturé !')}
function doCapture(){const c=cfg();
  if(Date.now()<G.startedAt+c.wait*1000)return toast('Les zombies sont encore retenus');
  const pr=Object.keys(P).filter(i=>P[i].team==='prey'&&!P[i].caught);
  if(c.capType==='pin'){const v=(prompt('Code du survivant (4 chiffres) :')||'').trim();if(!v)return;const id=pr.find(i=>P[i].pin===v);id?capture(id):toast('Code incorrect')}
  else{if(!myPos)return toast('Position indisponible');
    const n=pr.filter(i=>P[i].lat!=null).map(i=>[i,distM(myPos,P[i])]).sort((a,b)=>a[1]-b[1])[0];
    n&&n[1]<=c.capDist?capture(n[0]):toast('Aucun survivant à moins de '+c.capDist+' m')}}
function buy(id){const me=P[uid]||{},c=cfg(),h=me.team==='hunter',it=IT[h?'hunter':'prey'].find(i=>i[0]===id),cd=(h?c.cdHunt:c.cdPrey)*1000;
  if(!it||G.status!=='running')return;
  if((me.money||0)<it[3])return toast('Pas assez de crédits');
  if(Date.now()<lastBuy+cd)return toast('Recharge : '+Math.ceil((lastBuy+cd-Date.now())/1000)+' s');
  const near=t=>{if(!myPos)return null;return Object.keys(P).filter(i=>P[i].team===t&&!P[i].caught&&P[i].lat!=null&&i!==uid).map(i=>[i,distM(myPos,P[i])]).sort((a,b)=>a[1]-b[1])[0]};
  const pr=db.doc(`games/${code}/players/${uid}`),gm=db.doc('games/'+code),off=(p,d,a)=>({lat:p.lat+d*Math.sin(a)/110540,lng:p.lng+d*Math.cos(a)/(111320*Math.cos(p.lat*Math.PI/180))});

  if(id==='ping'){n=near('prey');if(!n)return toast('Aucun survivant localisé');m='Survivant le plus proche : '+Math.round(n[1])+' m'}
  else if(id==='scan'){n=near('prey');if(!n)return toast('Aucun survivant localisé');scanC=Object.assign(off(P[n[0]],Math.random()*25,Math.random()*6.283),{until:Date.now()+30000});m='Zone de 50 m affichée pendant 30 s'}
  else if(id==='ghost'||id==='camo'){pr.update({ghost:true});m='Ton prochain ping sera ignoré'}
  else if(id==='move'){if(c.shape==='polygon'||!myPos||c.lat==='')return toast('Impossible avec cette zone');gm.update({'cfg.lat':c.lat+(myPos.lat-c.lat)*.8,'cfg.lng':c.lng+(myPos.lng-c.lng)*.8});m='Zone rapprochée de toi'}
  else if(id==='rev'){gm.update({reveal:{until:Date.now()+5000}});m='Tous les survivants sont visibles 5 s'}
  else if(id==='sense'){n=near('hunter');if(!n)return toast('Aucun zombie localisé');const p=P[n[0]],b=(Math.atan2((p.lng-myPos.lng)*Math.cos(myPos.lat*Math.PI/180),p.lat-myPos.lat)*180/Math.PI+360)%360;m='Zombie le plus proche : '+['N','NE','E','SE','S','SO','O','NO'][Math.round(b/45)%8]+', '+Math.round(n[1])+' m'}
  else if(id==='shield'){pr.update({shield:true});m='Bouclier actif'}
  else if(id==='decoy'){if(!myPos)return toast('Position indisponible');pr.update({decoy:off(myPos,150,Math.random()*6.283)});m='Faux ping prêt pour ton prochain ping'}
  lastBuy=Date.now();pr.update({money:inc(-it[3])});toast(m,4500)}
/* ---- zone ---- */
const rk=(c,i)=>{const r0=c.diam/2,r1=Math.min(c.endDiam,c.diam)/2;return r0+(r1-r0)*i/Math.max(1,c.phases-1)};
function radius(c,el){const N=c.phases;if(N<2)return c.diam/2;const s=el/1000,L=Math.max(1,(c.durMin*60-c.lastTime)/(N-1)),k=Math.min(N-1,Math.floor(s/L));
  if(k<1)return rk(c,0);const t=Math.min(1,(s-k*L)/Math.max(1,c.trans));return rk(c,k-1)+(rk(c,k)-rk(c,k-1))*t}
function nextShrink(c,el){const N=c.phases;if(N<2)return null;const L=Math.max(1,(c.durMin*60-c.lastTime)/(N-1))*1000,k=Math.floor(el/L);return k>=N-1?null:{ms:(k+1)*L-el,to:Math.round(rk(c,k+1)*2)}}
function calc(c){let o=['Départ '+c.diam+' m'];if(c.phases>1){const L=(c.durMin*60-c.lastTime)/(c.phases-1);for(let i=1;i<c.phases;i++)o.push('après '+fmt(i*L*1000)+' : '+Math.round(rk(c,i)*2)+' m')}return o.join(' → ')}
const cen=pl=>({lat:pl.reduce((a,q)=>a+q.lat,0)/pl.length,lng:pl.reduce((a,q)=>a+q.lng,0)/pl.length});
function inside(pts,p){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.lng>p.lng)!==(b.lng>p.lng)&&p.lat<(b.lat-a.lat)*(p.lng-a.lng)/(b.lng-a.lng)+a.lat)ins=!ins}return ins}
function zone(c,el){
  const r=radius(c,el),r0=c.diam/2,r1=Math.min(c.endDiam,c.diam)/2,f=r/r0,pr=r0===r1?0:(r0-r)/(r0-r1);
  if(c.shape==='polygon'){const pl=c.poly||[];if(pl.length<3)return{r,f,pts:[],base:pl};const ce=cen(pl);
    return{r,f,base:pl,pts:pl.map(q=>({lat:ce.lat+(q.lat-ce.lat)*f,lng:ce.lng+(q.lng-ce.lng)*f}))}}
  const e=G&&G.endC;return{r,f,cn:e&&mv(c)?{lat:c.lat+(e.lat-c.lat)*pr,lng:c.lng+(e.lng-c.lng)*pr}:{lat:c.lat,lng:c.lng}}}

function mkMap(){
  if(map){map.remove();map=null}
  map=L.map('map',{zoomControl:false}).setView([46.6,2.4],5);layer=L.layerGroup().addTo(map);
  tile=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});if(bg)tile.addTo(map);view='';
  map.on('click',e=>{if(!isAdmin()||G.status!=='lobby')return;const q={lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6)};
    if(E.shape==='polygon')E.poly.push(q);else{E.lat=q.lat;E.lng=q.lng}save();update()});
}
function build(){
  const adm=isAdmin(),lobby=G.status==='lobby';barK='';
  if(adm&&lobby){E=Object.assign({},D,G.cfg);E.poly=(E.poly||[]).slice();if(E.move===true)E.move='random';if(E.move===false)E.move='fixed'}
  app.innerHTML=`<div id="map"></div><div class="hud"><div class="top"><div><small>Temps</small><b id="t1">--:--</b></div><div style="text-align:right"><small>Zone</small><b id="t2" style="color:var(--hl)">-</b></div></div>
  <div class="pill" id="p1"></div><div class="row2"><button class="fab" id="gear" style="display:${adm&&lobby?'grid':'none'}">⚙️</button><button class="fab" id="ctr">📍</button><button class="fab" id="bgb">🗺</button><div class="pill" id="p2"></div></div><div class="pill" id="bn" style="display:none"></div></div>
  <button class="fab chat" id="chb">💬</button><div class="cnt"><div class="cs" id="ns"></div><div class="cz" id="nz"></div></div><div class="bar" id="bar"></div><div id="sh"></div><div id="ts"></div>`;
  mkMap();
  $('#gear').onclick=()=>openSettings(0);
  $('#ctr').onclick=()=>{if(myPos)map.setView([myPos.lat,myPos.lng],Math.max(map.getZoom(),17));else toast('Position indisponible : autorise la localisation.')};
  $('#bgb').onclick=()=>{bg=!bg;bg?tile.addTo(map):map.removeLayer(tile)};
  $('#chb').onclick=openChat;
}
function save(){clearTimeout(svT);svT=setTimeout(()=>db.doc('games/'+code).update({cfg:E}).catch(()=>{}),400)}
function finish(w){if(ending)return;ending=true;db.doc('games/'+code).update({status:'ended',endedAt:Date.now(),winner:w}).catch(()=>{ending=false})}
async function start(){
  await db.doc('games/'+code).update({cfg:E});const c=E;
  if(c.shape==='polygon'?(c.poly||[]).length<3:(c.lat===''||c.lng==='')){alert('Définis d’abord la zone : ouvre ⚙️ puis touche la carte.');return}
  const pp=Object.values(P);if(!pp.some(p=>p.team==='hunter')||!pp.some(p=>p.team==='prey')){alert('Il faut au moins un zombie et un survivant.');return}
  let en=null;if(c.shape!=='polygon'&&mv(c)){const R=Math.max(0,c.diam/2-Math.min(c.endDiam,c.diam)/2),a=Math.random()*6.2832,d=Math.sqrt(Math.random())*R;en={lat:c.lat+d*Math.sin(a)/110540,lng:c.lng+d*Math.cos(a)/(111320*Math.cos(c.lat*Math.PI/180))}}
  db.doc('games/'+code).update({status:'running',startedAt:Date.now(),endC:en})}
function bar(me){
  const c=cfg(),run=G.status==='running',lobby=G.status==='lobby',adm=isAdmin(),k=[G.status,me.team,me.caught,adm,C().teamMode,c.capType,c.shop,c.eco].join();
  if(k===barK){const m=$('#mn');if(m)m.textContent=me.money||0;return}barK=k;
  const rl=me.team==='hunter'?'ZOMBIE':me.team==='prey'?'SURVIVANT':adm?'ADMIN':'SPECTATEUR',ex='<button class="fab" id="lv" style="color:#d33">⎋</button>';
  let h='';
  if(lobby){h=`<div class="role"><b>Salon</b><br><span>${esc(code)}</span></div>`;
    if(C().teamMode==='choose')h+=`<button class="btn ${me.team==='hunter'?'on':''}" data-m="hunter">Zombie</button><button class="btn ${me.team==='prey'?'on':''}" data-m="prey">Survivant</button>`;
    h+=(adm?'<button class="fill" id="go">▶ Lancer</button>':'')+'<button class="fab" id="pls">👥</button>'+ex}
  else if(run){h=`<div class="role"><b>${rl}</b><br><span>${me.caught?'CAPTURÉ':'ACTIF'}</span></div>`;
    if(me.team==='hunter')h+='<button class="btn" id="cap">🎯 Capturer</button>';
    if(me.team&&c.eco!==false&&(me.team==='hunter'||c.shop!==false))h+=`<button class="btn" id="shp">🛒 <span id="mn">${me.money||0}</span></button>`;
    if(me.team==='prey'&&c.capType==='pin')h+='<button class="fab" id="key">🔑</button>';
    h+='<button class="fab" id="pls">👥</button>'+ex}
  else h=`<div class="role"><b>Terminée</b></div>`+ex;
  $('#bar').innerHTML=h;
  const g=s=>$(s);
  if(g('#go'))g('#go').onclick=start;
  if(g('#cap'))g('#cap').onclick=doCapture;
  if(g('#shp'))g('#shp').onclick=openShop;
  if(g('#pls'))g('#pls').onclick=openPlayers;
  if(g('#key'))g('#key').onclick=()=>toast('Ton code : '+(P[uid]&&P[uid].pin),8000);
  if(g('#lv'))g('#lv').onclick=()=>{if(confirm('Quitter la partie ? Tu pourras la rejoindre avec son identifiant.'))home()};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>db.doc(`games/${code}/players/${uid}`).update({team:b.dataset.m}))}
function update(){
  if(!G||!$('#t1'))return;
  const c=C(),run=G.status==='running',end=G.status==='ended',lobby=G.status==='lobby',adm=isAdmin(),me=P[uid]||{};
  const el=run?Date.now()-G.startedAt:end?(G.endedAt||Date.now())-G.startedAt:0,Z=zone(c,el),r=Z.r;
  document.body.className=me.team==='hunter'&&!lobby?'d':'';
  sendPos();
  if(run){
    if(el>=c.durMin*60000)finish('prey');
    if(ready&&!Object.values(P).some(p=>p.team==='prey'&&!p.caught))finish('hunters');
    if(c.eco!==false&&me.team&&!me.caught){if(!earnAt)earnAt=Date.now();if(Date.now()-earnAt>=60000){earnAt+=60000;if(c.cpm)db.doc(`games/${code}/players/${uid}`).update({money:inc(c.cpm)})}}
  }
  $('#t1').textContent=lobby?'--:--':fmt(c.durMin*60000-el);
  $('#t2').textContent=c.shape==='polygon'?Math.round(Z.f*100)+'%':Math.round(r*2)+'M';
  const ns=run?nextShrink(c,el):null,pm=c.pingMin*60000;
  $('#p1').textContent=lobby?'SALON · '+code+' · '+Object.keys(P).length+' JOUEUR(S)':end?'PARTIE TERMINÉE':ns?`RÉTRÉCISSEMENT DANS ${fmt(ns.ms)} → ${ns.to}M`:'ZONE MINIMALE';
  const p2=$('#p2');p2.style.display=run&&c.pings!==false?'block':'none';
  if(run)p2.textContent='👁 PING DANS '+fmt(pm-(el%pm));
  const Ps=Object.values(P);$('#ns').textContent='👤 '+Ps.filter(p=>p.team==='prey'&&!p.caught).length;$('#nz').textContent='✖ '+Ps.filter(p=>p.team==='hunter').length;
  let msg='',cls='warn';
  if(end){msg=G.winner==='hunters'?'🧟 Les zombies gagnent !':G.winner==='prey'?'🟢 Les survivants gagnent !':'Partie terminée.';cls='okb'}
  else if(run&&me.team==='hunter'&&Date.now()<G.startedAt+c.wait*1000)msg='Zombies libérés dans '+Math.ceil((G.startedAt+c.wait*1000-Date.now())/1000)+' s';
  else if(run&&me.team&&myPos&&!me.caught){
    const out=c.shape==='polygon'?(Z.pts.length>2&&!inside(Z.pts,myPos)):(c.lat!==''&&distM(Z.cn,myPos)>r);
    if(out){if(!outAt)outAt=Date.now();const left=c.outTime-(Date.now()-outAt)/1000;
      if(left>0)msg='⚠️ Hors zone : '+Math.ceil(left)+' s';
      else{msg='⚠️ Hors zone !';if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}
        if(!outDone){outDone=true;if(me.team==='prey'&&c.outPing){if(me.shield){db.doc(`games/${code}/players/${uid}`).update({shield:false});toast('Bouclier utilisé')}else db.doc(`games/${code}/players/${uid}`).update({pub:{lat:myPos.lat,lng:myPos.lng,at:Date.now()}})}}}}
    else{outAt=0;outDone=false}}
  if(run&&me.caught)msg='Tu as été capturé : spectateur.';
  else if(run&&me.wasCaught&&me.team==='hunter'&&!msg){msg='Capturé : tu es maintenant zombie !';cls='okb'}
  const b=$('#bn');b.style.display=msg?'block':'none';b.textContent=msg;b.className='pill '+cls;
  bar(me);draw(c,Z,run,adm,me);
}
function draw(c,Z,run,adm,me){
  if(!map)return;layer.clearLayers();
  const lobby=G.status==='lobby',pg=c.shape==='polygon',ll=q=>[q.lat,q.lng],draft=lobby&&adm;
  if(pg){const base=c.poly||[];
    if(base.length){
      if(draft)base.forEach(q=>L.circleMarker(ll(q),{radius:5,color:'#d33',fillOpacity:1}).addTo(layer));
      const key='p'+base.length+base[0].lat;
      if(view!==key){view=key;if(!draft)map.fitBounds(L.polygon(base.map(ll)).getBounds(),{padding:[20,20]})}
      L.polygon(base.map(ll),{color:'#888',weight:2,dashArray:'8 8',fill:false}).addTo(layer);
      if(!draft&&Z.pts.length>2)L.polygon(Z.pts.map(ll),{color:'#e5484d',weight:3,fillColor:'#e5484d',fillOpacity:.1}).addTo(layer)}
  }else if(c.lat!==''&&c.lng!==''&&c.lat!=null){
    const o=[c.lat,c.lng],k=o+','+c.diam;
    if(view!==k){view=k;map.fitBounds(L.circle(o,{radius:c.diam/2}).getBounds(),{padding:[20,20]})}
    L.circle(o,{radius:c.diam/2,color:'#888',weight:2,dashArray:'8 8',fill:false}).addTo(layer);
    L.circle([Z.cn.lat,Z.cn.lng],{radius:Z.r,color:'#e5484d',weight:3,fillColor:'#e5484d',fillOpacity:.1}).addTo(layer)}
  const dot=(p,col,lab,big)=>{if(p.lat==null)return;L.circleMarker([p.lat,p.lng],{radius:big?10:8,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).bindTooltip(lab,{permanent:true,direction:'top',offset:[0,-8]}).addTo(layer)};
  const H_='#e5484d',P_='#2f9e5b',rev=G.reveal&&Date.now()<G.reveal.until,nm=p=>c.named?(p.name||'?'):(p.team==='hunter'?'Zombie':'Survivant');
  Object.keys(P).forEach(id=>{const p=P[id];if(id===uid||!p.team||p.caught)return;
    const pubOk=p.pub&&(c.pingShow===0||Date.now()-p.pub.at<c.pingShow*1000);
    if(adm)dot(p,p.team==='hunter'?H_:P_,p.name||'?');
    else if(me.team==='hunter'){if(p.team==='hunter')dot(p,H_,p.name||'?');else if(run&&rev)dot(p,P_,p.name||'?');else if(run&&pubOk)dot(p.pub,P_,nm(p)+' ('+fmt(Date.now()-p.pub.at)+')')}
    else if(me.team==='prey'){if(p.team==='prey')dot(p,P_,p.name||'?');else if(run&&pubOk)dot(p.pub,H_,nm(p)+' ('+fmt(Date.now()-p.pub.at)+')')}});
  if(scanC&&Date.now()<scanC.until)L.circle([scanC.lat,scanC.lng],{radius:50,color:'#7dff1a',weight:2,fillOpacity:.08}).addTo(layer);
  if(myPos&&me.team)dot(myPos,'#3b82f6','Moi',true);
}
/* ---- panneaux ---- */
function openSheet(live,fn,rf){SH={live,fn,rf};const s=$('#sh');s.className='o';s.innerHTML='<div class="pan" id="pan"></div>';s.onclick=e=>{if(e.target===s)closeSheet()};fn($('#pan'))}
function closeSheet(){SH=null;const s=$('#sh');if(s){s.className='';s.innerHTML=''}}
function liveRefresh(){if(SH&&SH.live&&$('#pan'))(SH.rf||SH.fn)($('#pan'))}
function row(f){const[t,k,l,ty,a,b,s,u]=f,v=E[k];
  if(ty==='b')return `<div class="st"><div class="h">${l}<input class="tg" type="checkbox" data-k="${k}" ${v!==false&&v?'checked':''}></div></div>`;
  if(ty==='s')return `<div class="st"><div class="h">${l}</div><div class="seg">${a.map(o=>`<button data-k="${k}" data-v="${o[0]}" class="${String(v)===o[0]?'on':''}">${o[1]}</button>`).join('')}</div></div>`;
  return `<div class="st"><div class="h">${l}<span class="v" id="v_${k}">${v}${u}</span></div><input type="range" data-k="${k}" data-u="${u}" min="${a}" max="${b}" step="${s}" value="${v}"></div>`}
function openSettings(tab){openSheet(false,el=>{
  let ex='';
  if(tab===1)ex=`<div class="st"><div class="h">Centre : ${E.lat===''?'à placer sur la carte':(+E.lat).toFixed(4)+', '+(+E.lng).toFixed(4)}</div><button class="sm" id="here">📍 Centre = ma position</button>${E.shape==='polygon'?'<button class="sm" id="pu">↩ Retirer un point</button><button class="sm" id="pc">Tout effacer</button> <span class="mu">'+E.poly.length+' sommet(s)</span>':''}<p class="mu">Ferme ce panneau puis touche la carte pour placer le centre (ou les sommets du polygone).</p></div><div class="h" style="font-size:13px;font-weight:700;letter-spacing:.06em">CALCULÉ</div><div class="calc">${calc(E)}</div>`;
  el.innerHTML=`<div class="tabs">${['🎚','🗺','🎮','💲'].map((t,i)=>`<button data-tab="${i}" class="${i===tab?'on':''}">${t}</button>`).join('')}</div><h2>${['Config & gameplay','Zone','Jeu & alertes','Économie & boutique'][tab]}</h2>${F.filter(f=>f[0]===tab).map(row).join('')}${ex}`;
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openSettings(+b.dataset.tab));
  el.querySelectorAll('input[data-k]').forEach(i=>i.oninput=()=>{const k=i.dataset.k;E[k]=i.type==='checkbox'?i.checked:+i.value;const v=$('#v_'+k);if(v)v.textContent=E[k]+i.dataset.u;const cl=el.querySelector('.calc');if(cl)cl.textContent=calc(E);save();update()});
  el.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{E[b.dataset.k]=b.dataset.v;save();update();openSettings(tab)});
  const h=$('#here');if(h)h.onclick=()=>{if(!myPos)return toast('Position indisponible : autorise la localisation.');E.lat=+myPos.lat.toFixed(6);E.lng=+myPos.lng.toFixed(6);save();update();openSettings(tab)};
  if($('#pu'))$('#pu').onclick=()=>{E.poly.pop();save();update();openSettings(tab)};
  if($('#pc'))$('#pc').onclick=()=>{E.poly=[];save();update();openSettings(tab)};
})}
function openShop(){openSheet(true,el=>{
  const me=P[uid]||{},h=me.team==='hunter';
  el.innerHTML=`<div class="top2"><div><h2>${h?'Boutique d’objets':'Boutique des cachés'}</h2><span class="mu">${h?'Obtenez des bonus et objets':'Dépassez les chasseurs'}</span></div><span class="coin">💲 ${me.money||0}</span></div><div class="grid">${IT[h?'hunter':'prey'].map(i=>`<button class="it ${(me.money||0)<i[3]?'no':''}" data-b="${i[0]}"><div class="ic">${i[4]}</div><h4>${i[1]}</h4><p>${i[2]}</p><span class="pr">💲 ${i[3]}</span></button>`).join('')}</div>`;

function openPlayers(){openSheet(true,el=>{
  const adm=isAdmin(),ids=Object.keys(P).sort((a,b)=>(P[a].name||'').localeCompare(P[b].name||'')),T={hunter:'Zombie',prey:'Survivant','':'Sans équipe'};
